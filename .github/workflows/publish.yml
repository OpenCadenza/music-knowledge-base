name: Publish approved Wiki snapshot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: knowledge-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'OpenCadenza/music-knowledge-base' && github.ref == 'refs/heads/main' && vars.WIKI_PUBLISH_ENABLED != 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: wiki-publication
    timeout-minutes: 15
    steps:
      - name: Mint repository-scoped Wiki publisher identity
        id: publisher-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.WIKI_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.WIKI_PUBLISHER_PRIVATE_KEY }}
          owner: OpenCadenza
          repositories: music-knowledge-base
          permission-contents: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.publisher-token.outputs.token }}
          persist-credentials: true
      - name: Record active publication identity
        env:
          PUBLISHER_APP_ID: ${{ vars.WIKI_PUBLISHER_APP_ID }}
          PUBLISHER_APP_SLUG: ${{ steps.publisher-token.outputs.app-slug }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          record={'schema_version':1,'app_id':int(os.environ['PUBLISHER_APP_ID']),'app_slug':os.environ['PUBLISHER_APP_SLUG'],'git_identity':os.environ['PUBLISHER_APP_SLUG']+'[bot]','repository':'OpenCadenza/music-knowledge-base','source':'https://wiki.opencadenza.com','policy':'explicitly approved revision with completed conversion'}
          pathlib.Path('.github/publisher.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Fetch approved conversion snapshot
        env:
          KB_EXPORT_TOKEN: ${{ secrets.KB_EXPORT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          request=urllib.request.Request('https://wiki.opencadenza.com/_kb/export',headers={'Authorization':'Bearer '+os.environ['KB_EXPORT_TOKEN']})
          with urllib.request.urlopen(request,timeout=60) as response: snapshot=json.load(response)
          files=snapshot['files']
          for name in files:
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in name
              assert path.parts[0] not in ('.git','.github')
          for path in pathlib.Path('.').rglob('*'):
              if path.is_file() and not set(path.parts).intersection({'.git','.github'}) and path.as_posix() not in files: path.unlink()
          for name,text in files.items():
              path=pathlib.Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(text.encode('utf-8'))
          pathlib.Path(os.environ['RUNNER_TEMP'],'batch-id').write_text(snapshot['batch_id'])
          PY
      - name: Push a single atomic commit and acknowledge
        env:
          KB_EXPORT_TOKEN: ${{ secrets.KB_EXPORT_TOKEN }}
          PUBLISHER_APP_SLUG: ${{ steps.publisher-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          publisher_name="${PUBLISHER_APP_SLUG}[bot]"
          publisher_id=$(gh api "/users/${publisher_name}" --jq .id)
          git config user.name "$publisher_name"
          git config user.email "${publisher_id}+${publisher_name}@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Publish $(cat "$RUNNER_TEMP/batch-id")"; git push origin HEAD:main; fi
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json,os,pathlib,subprocess,urllib.request
          body={'batch_id':pathlib.Path(os.environ['RUNNER_TEMP'],'batch-id').read_text(),'commit_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          request=urllib.request.Request('https://wiki.opencadenza.com/_kb/export/receipt',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['KB_EXPORT_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response: print(response.read().decode())
          PY
      - name: Continue publication without relying on cron dispatch
        if: always() && !cancelled() && vars.WIKI_PUBLISH_ENABLED != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 300
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/OpenCadenza/music-knowledge-base/actions/workflows/publish.yml/dispatches'
          for attempt in range(3):
              try:
                  req=urllib.request.Request(url,data=json.dumps({'ref':'main'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  with urllib.request.urlopen(req,timeout=30) as r: assert r.status==204
                  print('Next publication cycle dispatched');break
              except Exception:
                  if attempt==2: raise
                  time.sleep(10*(attempt+1))
          PY
